<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時間帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a lab notebook page; the day grid is the main surface, summaries follow. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --ink:#1c2130; --muted:#646b78; --line:#dadde2; --soft:#eceef1;
  --accent:#2f3f9e; --accent-ink:#ffffff; --warn:#b5462f;
  --c-thesis:#2f3f9e; --c-job:#7280cf; --c-toefl:#1d8574; --c-french:#4fae9c; --c-read:#93cbbd;
  --c-chores:#ad9c7b; --c-rest:#d5c9ae; --c-drift:#df644c;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --surface:#1b1e26; --ink:#e7e8ed; --muted:#9a9fac; --line:#2c303a; --soft:#242832;
  --accent:#8e9bf2; --accent-ink:#11131a; --warn:#f08a72;
  --c-thesis:#8190f2; --c-job:#b0b9f6; --c-toefl:#38b5a1; --c-french:#6cc8b6; --c-read:#a6dacd;
  --c-chores:#9a8d72; --c-rest:#6e6655; --c-drift:#f07e67; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151b; --surface:#1b1e26; --ink:#e7e8ed; --muted:#9a9fac; --line:#2c303a; --soft:#242832;
  --accent:#8e9bf2; --accent-ink:#11131a; --warn:#f08a72;
  --c-thesis:#8190f2; --c-job:#b0b9f6; --c-toefl:#38b5a1; --c-french:#6cc8b6; --c-read:#a6dacd;
  --c-chores:#9a8d72; --c-rest:#6e6655; --c-drift:#f07e67; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;width:100%}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:.04em;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud .dot{background:var(--c-toefl)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:max-content}
.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:6px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0}
.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.daynav .date{font-family:var(--f-display);font-size:20px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font:500 13px var(--f-body);cursor:pointer;padding:4px}
.mit{display:flex;gap:10px;align-items:center}
.mit input[type=text]{flex:1;min-width:0}
.check{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=text],select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mit.done input[type=text]{text-decoration:line-through;color:var(--muted)}

/* brushes */
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.chips{grid-template-columns:repeat(5,minmax(0,1fr))}}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;font:500 14px var(--f-body);cursor:pointer;text-align:left;min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.chip .sw.erase{background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 4px);border:1px solid var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}

/* day grid */
.gap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.gap b{font-family:var(--f-num);font-weight:500}
.grid{display:flex;flex-direction:column;gap:3px;user-select:none;-webkit-user-select:none}
.hr{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:3px;align-items:stretch}
.hr .h{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.cell{height:34px;border:0;border-radius:5px;background:var(--soft);font:500 12.5px var(--f-body);color:var(--ink);text-align:left;padding:0 8px;cursor:pointer;touch-action:none;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:4px solid transparent}
.cell.half{border-top-left-radius:5px}
.cell.future{opacity:.5}
.cell.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cell:hover{filter:brightness(.97)}
.nightbtn{align-self:flex-start}

.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g{display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:3px solid var(--line)}
.g .n{font-size:12px;color:var(--muted)}
.g .v{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .m{font-family:var(--f-num);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.3}
.empty{color:var(--muted);font-size:14px;margin:0}

details.timer summary{cursor:pointer;font-size:14px;color:var(--accent);list-style:none}
details.timer summary::-webkit-details-marker{display:none}
details.timer summary::before{content:"▸ ";color:var(--muted)}
details.timer[open] summary::before{content:"▾ "}
.timerbody{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.clock{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.clock .time{font-family:var(--f-num);font-size:36px;font-variant-numeric:tabular-nums;line-height:1}
.clock .label{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:500 14px var(--f-body);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.stop{background:var(--warn);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.warn{color:var(--warn);font-size:13px;margin:0}

.chart{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.yax{position:relative;height:180px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;height:180px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.col{position:relative;height:100%;display:flex;flex-direction:column-reverse;z-index:1}
.col i{display:block;width:100%}
.col i:last-child{border-radius:4px 4px 0 0}
.col.today{outline:1px solid var(--ink);outline-offset:3px;border-radius:4px}
.xax{grid-column:2;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;text-align:center;font-size:12px;color:var(--muted)}
.xax b{display:block;font-weight:500;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.insights{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.fill,.col i{transition:height .3s ease,width .3s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>時間帳本</h1>
      <p class="sub">每隔幾小時或睡前回想一次，把格子塗上顏色。</p>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncText">只存在這個瀏覽器</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabToday" aria-selected="true">今天</button>
    <button role="tab" id="tabWeek" aria-selected="false">本週</button>
  </div>

  <div id="viewToday" class="wrap">
    <section class="panel">
      <div class="daynav">
        <button class="iconbtn" id="prevDay" aria-label="前一天">‹</button>
        <div style="text-align:center"><div class="date" id="dateLabel"></div><button class="linkbtn" id="goToday" hidden>回到今天</button></div>
        <button class="iconbtn" id="nextDay" aria-label="後一天">›</button>
      </div>
      <h2>這天最重要的一件事</h2>
      <div class="mit" id="mitRow">
        <input type="checkbox" class="check" id="mitDone" aria-label="完成">
        <input type="text" id="mitText" placeholder="例如：把實驗 A 的結果畫成圖" maxlength="120" enterkeyhint="done">
      </div>
      <p class="hint" id="mitHint">每天只寫一件。打完按 Enter 儲存，做完回來打勾。其他待辦不用寫在這裡。</p>
    </section>

    <section class="panel">
      <div class="gap"><h2>回填時間</h2><span id="gapText"></span></div>
      <p class="hint">先選一個顏色，再點或拖過格子。拖過同顏色的格子會清掉。每格 30 分鐘。</p>
      <div class="chips" id="chips"></div>
      <button class="linkbtn nightbtn" id="nightBtn"></button>
      <div class="grid" id="grid"></div>
    </section>

    <section class="panel">
      <h2>這天的分配</h2>
      <div class="groups" id="dayGroups"></div>
      <div class="bars" id="dayBars"></div>
    </section>

    <section class="panel">
      <details class="timer" id="timerBox">
        <summary>想專心做一件事時，也可以用計時</summary>
        <div class="timerbody">
          <div class="clock"><span class="time" id="clock">00:00:00</span><span class="label" id="clockLabel">選上面的顏色，再按開始</span></div>
          <div class="row">
            <button class="btn" id="startBtn">用目前顏色開始</button>
            <button class="btn stop" id="stopBtn" disabled>停止並填入格子</button>
          </div>
          <p class="hint">停止時會自動把這段時間填進格子（滿 15 分鐘的半小時才算一格）。</p>
          <p class="warn" id="staleWarn" hidden>這個計時已經超過 12 小時，可能忘了按停止。停止後可以在格子上修正。</p>
        </div>
      </details>
    </section>
  </div>

  <div id="viewWeek" class="wrap" hidden>
    <section class="panel">
      <h2>最近 7 天</h2>
      <div class="groups" id="weekGroups"></div>
      <div class="chart">
        <div class="yax" id="yax"></div>
        <div class="plot" id="plot"></div>
        <div class="xax" id="xax"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel">
      <h2>這週的觀察</h2>
      <ul class="insights" id="insights"></ul>
    </section>
    <section class="panel">
      <h2>各類別總時數</h2>
      <div class="bars" id="weekBars"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS=[
  {id:'thesis',name:'碩論',group:'main'},
  {id:'job',name:'求職',group:'main'},
  {id:'toefl',name:'托福單字',group:'invest'},
  {id:'french',name:'法文',group:'invest'},
  {id:'read',name:'課外書',group:'invest'},
  {id:'chores',name:'生活雜事',group:'life'},
  {id:'rest',name:'休息娛樂',group:'life'},
  {id:'drift',name:'滑手機／拖延',group:'drift'}
];
const GROUPS=[
  {id:'main',name:'主線',color:'var(--c-thesis)'},
  {id:'invest',name:'長期投資',color:'var(--c-toefl)'},
  {id:'life',name:'生活',color:'var(--c-chores)'},
  {id:'drift',name:'逃避',color:'var(--c-drift)'}
];
const SLOT=30*60000, N=48, DAY_START=14; // 07:00
const catById=Object.fromEntries(CATS.map(c=>[c.id,c]));
const col=id=>`var(--c-${id})`;
const tint=id=>`color-mix(in srgb, var(--c-${id}) 34%, var(--surface))`;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>keyOf(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const WD=['日','一','二','三','四','五','六'];
const fmtH=min=>{if(min<1)return '0h';const h=Math.floor(min/60),m=Math.round(min%60);return h?(m?`${h}h ${pad(m)}m`:`${h}h`):`${m}m`};
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const slotLabel=i=>`${pad(Math.floor(i/2))}:${i%2?'30':'00'}`;

let S={days:{},running:null};
let mode='local',db=null,base=null;
let view='today',cursor=todayKey();
let brush='thesis',showNight=false;
try{brush=localStorage.getItem('tl-brush')||'thesis';showNight=localStorage.getItem('tl-night')==='1'}catch(e){}

/* ---------- storage ---------- */
const LS='time-ledger-v1';
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S.days=o.days||{};S.running=o.running||null}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const chains={};
function write(id,data){
  chains[id]=(chains[id]||Promise.resolve()).then(()=>db.collection(base).doc(id).set(data))
    .catch(e=>toast(e&&e.code==='quota_exceeded'?'儲存空間已滿，請刪掉一些舊紀錄':'同步失敗，請稍後再試'));
}
function persistDay(k){if(mode==='cloud')write(k,JSON.parse(JSON.stringify(S.days[k])));else saveLocal()}
function persistState(){if(mode==='cloud')write('state',{running:S.running});else saveLocal()}
const dayOf=k=>S.days[k]||{mit:'',mitDone:false};
function setDay(k,d){S.days[k]=d;persistDay(k)}

/* slots: array of 48 category ids (or null); older timer entries are converted on read */
function slotsOf(k){
  const d=dayOf(k);
  if(Array.isArray(d.slots)&&d.slots.length===N)return d.slots;
  const arr=Array(N).fill(null);
  if(Array.isArray(d.entries)){const d0=parseKey(k).getTime();
    d.entries.forEach(e=>{for(let i=0;i<N;i++){const s=d0+i*SLOT,ov=Math.min(e.end,s+SLOT)-Math.max(e.start,s);if(ov>=SLOT/2)arr[i]=e.cat}})}
  return arr;
}
function saveSlots(k,slots){const d={...dayOf(k),slots};delete d.entries;setDay(k,d)}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();
    if(!id)return;
    db=d;base='data/users/'+id;
    db.collection(base).onSnapshot(snap=>{
      if(mode!=='cloud'){mode='cloud';$('sync').classList.add('cloud');$('syncText').textContent='已同步到你的帳號'}
      const days={};let running=null;
      snap.docs.forEach(doc=>{const v=doc.data();if(doc.id==='state')running=v.running||null;else if(/^\d{4}-\d{2}-\d{2}$/.test(doc.id))days[doc.id]=v});
      S.days=days;S.running=running;render();
    },()=>{toast('連線中斷，重新整理頁面即可恢復')});
  }catch(e){}
}

/* ---------- painting ---------- */
let drag=null,pendingRender=false;
function paint(i){
  if(!drag)return;
  const from=drag.last==null?i:drag.last;
  for(let j=Math.min(from,i);j<=Math.max(from,i);j++){drag.slots[j]=drag.val;const c=document.querySelector(`.cell[data-i="${j}"]`);if(c)styleCell(c,j,drag.slots)}
  drag.last=i;
}
function endDrag(){
  if(!drag)return;
  const changed=drag.slots.some((v,i)=>v!==drag.orig[i]);
  const slots=drag.slots;drag=null;
  if(changed)saveSlots(cursor,slots);
  render();
}
$('grid').addEventListener('pointerdown',e=>{
  const c=e.target.closest('[data-i]');if(!c)return;
  e.preventDefault();
  const i=+c.dataset.i,orig=slotsOf(cursor);
  const val=brush==='erase'?null:(orig[i]===brush?null:brush);
  drag={val,orig,slots:[...orig],last:null};
  try{$('grid').setPointerCapture(e.pointerId)}catch(err){}
  paint(i);
});
$('grid').addEventListener('pointermove',e=>{
  if(!drag)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('[data-i]');
  if(c)paint(+c.dataset.i);
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>$('grid').addEventListener(t,endDrag));

function styleCell(c,i,slots){
  const v=slots[i];
  c.style.background=v?tint(v):'';
  c.style.borderLeftColor=v?col(v):'transparent';
  const start=v&&(i===0||slots[i-1]!==v);
  c.textContent=start?catById[v].name:'';
  c.setAttribute('aria-label',`${slotLabel(i)} ${v?catById[v].name:'空白'}`);
}

/* ---------- timer ---------- */
function fillRange(start,end,cat){
  let k=keyOf(new Date(start)),filled=0;
  while(true){
    const d0=parseKey(k).getTime();if(d0>=end)break;
    const slots=[...slotsOf(k)];let changed=false;
    for(let i=0;i<N;i++){const s=d0+i*SLOT,ov=Math.min(end,s+SLOT)-Math.max(start,s);if(ov>=SLOT/2){slots[i]=cat;changed=true;filled++}}
    if(changed)saveSlots(k,slots);
    k=addDays(k,1);
  }
  return filled;
}
function startTimer(){
  if(brush==='erase'){toast('先選一個類別顏色');return}
  if(S.running&&S.running.cat===brush)return;
  if(S.running)stopTimer(true);
  S.running={cat:brush,start:Date.now()};persistState();render();
}
function stopTimer(silent){
  const r=S.running;if(!r)return;
  const end=Date.now();S.running=null;persistState();
  const n=fillRange(r.start,end,r.cat);
  if(!silent)toast(n?`已填入 ${catById[r.cat].name} ${fmtH(n*30)}`:'不到 15 分鐘，沒有填進格子');
  render();
}

/* ---------- derived ---------- */
function totals(keys){
  const byCat=Object.fromEntries(CATS.map(c=>[c.id,0]));
  keys.forEach(k=>slotsOf(k).forEach(v=>{if(v&&byCat[v]!=null)byCat[v]+=30}));
  const byGroup=Object.fromEntries(GROUPS.map(g=>[g.id,0]));
  CATS.forEach(c=>byGroup[c.group]+=byCat[c.id]);
  const all=Object.values(byCat).reduce((a,b)=>a+b,0);
  return {byCat,byGroup,all};
}
function groupTiles(t){
  return GROUPS.map(g=>`<div class="g" style="border-left-color:${g.color}"><span class="n">${g.name}</span><span class="v">${fmtH(t.byGroup[g.id])}</span></div>`).join('');
}
function catBars(t,divisor){
  const max=Math.max(1,...Object.values(t.byCat));
  return CATS.map(c=>{const v=t.byCat[c.id];return `<div class="bar"><span>${c.name}</span><div class="track"><div class="fill" style="width:${v/max*100}%;background:${col(c.id)}"></div></div><span class="m">${fmtH(v)}${divisor?`<br><small>日均 ${fmtH(v/divisor)}</small>`:''}</span></div>`}).join('');
}
function nowIdx(){const n=new Date();return n.getHours()*2+(n.getMinutes()>=30?1:0)}

/* ---------- render ---------- */
function render(){
  if(drag){pendingRender=true;return}
  const tk=todayKey(),isToday=cursor===tk;
  $('tabToday').setAttribute('aria-selected',view==='today');
  $('tabWeek').setAttribute('aria-selected',view==='week');
  $('viewToday').hidden=view!=='today';$('viewWeek').hidden=view!=='week';

  const dd=parseKey(cursor);
  $('dateLabel').textContent=`${dd.getMonth()+1} 月 ${dd.getDate()} 日（${WD[dd.getDay()]}）`;
  $('nextDay').disabled=cursor>=tk;$('goToday').hidden=isToday;
  const day=dayOf(cursor);
  if(document.activeElement!==$('mitText'))$('mitText').value=day.mit||'';
  $('mitDone').checked=!!day.mitDone;$('mitRow').classList.toggle('done',!!day.mitDone);

  // brushes
  $('chips').innerHTML=CATS.map(c=>`<button class="chip" data-brush="${c.id}" aria-pressed="${brush===c.id}"><span class="sw" style="background:${col(c.id)}"></span><span>${c.name}</span></button>`).join('')
    +`<button class="chip" data-brush="erase" aria-pressed="${brush==='erase'}"><span class="sw erase"></span><span>清除</span></button>`;

  // grid
  const slots=slotsOf(cursor),ni=isToday?nowIdx():-1;
  const nightFilled=slots.slice(0,DAY_START).filter(Boolean).length;
  $('nightBtn').textContent=showNight?'收起 00:00–07:00':`顯示 00:00–07:00${nightFilled?`（有 ${nightFilled} 格紀錄）`:''}`;
  const h0=showNight?0:DAY_START/2;
  let html='';
  for(let h=h0;h<24;h++){
    html+=`<div class="hr"><span class="h">${pad(h)}:00</span>`;
    for(const i of [h*2,h*2+1])html+=`<button class="cell${isToday&&i>ni?' future':''}${i===ni?' now':''}" data-i="${i}"></button>`;
    html+='</div>';
  }
  $('grid').innerHTML=html;
  document.querySelectorAll('.cell').forEach(c=>styleCell(c,+c.dataset.i,slots));

  // gap nudge
  const until=isToday?ni:N;
  const blanks=slots.slice(DAY_START,Math.max(DAY_START,until)).filter(v=>!v).length;
  $('gapText').innerHTML=until<=DAY_START?'':blanks?`07:00 到${isToday?'現在':'午夜'}還有 <b>${fmtH(blanks*30)}</b> 空白`:'這段時間都填滿了';

  // summary
  const t=totals([cursor]);
  $('dayGroups').innerHTML=groupTiles(t);
  $('dayBars').innerHTML=t.all?catBars(t):'<p class="empty">這天還沒有紀錄。選一個顏色，從上面的格子開始塗。</p>';

  // timer
  const r=S.running;
  $('stopBtn').disabled=!r;
  $('startBtn').textContent=brush==='erase'?'先選一個類別':(r&&r.cat===brush?'正在計時中':`開始：${catById[brush].name}`);
  $('startBtn').disabled=brush==='erase'||!!(r&&r.cat===brush);
  if(r)$('timerBox').open=true;
  tick();

  if(view==='week')renderWeek(tk);
}

function renderWeek(tk){
  const keys=[...Array(7)].map((_,i)=>addDays(tk,i-6));
  const prev=[...Array(7)].map((_,i)=>addDays(tk,i-13));
  const t=totals(keys),tp=totals(prev);
  $('weekGroups').innerHTML=groupTiles(t);
  const perDay=keys.map(k=>totals([k]));
  const maxH=Math.max(2,...perDay.map(p=>p.all/60));
  const top=Math.ceil(maxH/2)*2,steps=top<=6?top/2:top<=12?top/4:top/6;
  let y='',g='';for(let v=0;v<=top+1e-9;v+=steps){const p=v/top*100;y+=`<span style="bottom:${p}%">${Math.round(v*10)/10}h</span>`;g+=`<div class="gl" style="bottom:${p}%"></div>`}
  $('yax').innerHTML=y;
  $('plot').innerHTML=g+perDay.map((p,i)=>`<div class="col${keys[i]===tk?' today':''}" title="${fmtH(p.all)}">${GROUPS.map(gr=>p.byGroup[gr.id]>0?`<i style="height:${p.byGroup[gr.id]/60/top*100}%;background:${gr.color}"></i>`:'').join('')}</div>`).join('');
  $('xax').innerHTML=keys.map(k=>{const d=parseKey(k);return `<span><b>${WD[d.getDay()]}</b>${d.getMonth()+1}/${d.getDate()}</span>`}).join('');
  $('legend').innerHTML=GROUPS.map(gr=>`<span><i style="background:${gr.color}"></i>${gr.name}</span>`).join('');
  $('weekBars').innerHTML=catBars(t,7);

  const ins=[];
  if(!t.all){ins.push('這 7 天還沒有紀錄。先填滿一週，這裡就會開始有東西可以看。')}
  else{
    const th=t.byCat.thesis,thp=tp.byCat.thesis;
    ins.push(`碩論 ${fmtH(th)}，平均每天 ${fmtH(th/7)}`+(thp?`，上週是 ${fmtH(thp)}（${th>=thp?'多了':'少了'} ${fmtH(Math.abs(th-thp))}）。`:'。'));
    const mainPct=Math.round(t.byGroup.main/t.all*100),driftPct=Math.round(t.byGroup.drift/t.all*100);
    ins.push(`有記錄的時間裡，主線佔 ${mainPct}%，逃避佔 ${driftPct}%。`);
    if(t.byGroup.invest>t.byGroup.main)ins.push('長期投資（單字、法文、閱讀）比主線還多。如果碩論這週有進度目標，可以考慮把它們移到碩論之後做。');
    const mitSet=keys.filter(k=>dayOf(k).mit).length,mitDone=keys.filter(k=>dayOf(k).mitDone).length;
    if(mitSet)ins.push(`有寫「最重要的一件事」的天數 ${mitSet} 天，完成 ${mitDone} 天。`);
    const starts=[];keys.forEach(k=>{const s=slotsOf(k);s.forEach((v,i)=>{if(v==='thesis'&&(i===0||s[i-1]!=='thesis'))starts.push(Math.floor(i/2))})});
    if(starts.length>=3){const c={};starts.forEach(h=>c[h]=(c[h]||0)+1);const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];ins.push(`你最常在 ${pad(best)}:00 左右開始做碩論，這可能是你最容易進入狀態的時段。`)}
    const empty=keys.filter(k=>!slotsOf(k).some(Boolean)).length;
    if(empty)ins.push(`有 ${empty} 天完全沒記錄。漏記也是一種資訊：那幾天通常在做什麼？`);
  }
  $('insights').innerHTML=ins.map(s=>`<li>${esc(s)}</li>`).join('');
}

function tick(){
  const r=S.running;
  if(!r){$('clock').textContent='00:00:00';$('clockLabel').textContent='選上面的顏色，再按開始';$('staleWarn').hidden=true;return}
  const s=Math.floor((Date.now()-r.start)/1000);
  $('clock').textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
  $('clockLabel').textContent=`${catById[r.cat]?.name||''} · 從 ${hm(r.start)} 開始`;
  $('staleWarn').hidden=s<43200;
}

let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- wiring ---------- */
$('tabToday').onclick=()=>{view='today';render()};
$('tabWeek').onclick=()=>{view='week';render()};
$('prevDay').onclick=()=>{cursor=addDays(cursor,-1);render()};
$('nextDay').onclick=()=>{if(cursor<todayKey()){cursor=addDays(cursor,1);render()}};
$('goToday').onclick=()=>{cursor=todayKey();render()};
$('chips').onclick=e=>{const b=e.target.closest('[data-brush]');if(!b)return;brush=b.dataset.brush;try{localStorage.setItem('tl-brush',brush)}catch(err){}render()};
$('nightBtn').onclick=()=>{showNight=!showNight;try{localStorage.setItem('tl-night',showNight?'1':'0')}catch(err){}render()};
$('startBtn').onclick=startTimer;
$('stopBtn').onclick=()=>stopTimer(false);
$('mitText').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('mitText').blur()}};
$('mitText').onchange=()=>{const v=$('mitText').value.trim();setDay(cursor,{...dayOf(cursor),mit:v});toast(v?'已儲存，做完記得回來打勾':'已清空')};
$('mitDone').onchange=()=>{const done=$('mitDone').checked;setDay(cursor,{...dayOf(cursor),mitDone:done});render();if(done)toast('完成這天最重要的事')};
setInterval(()=>{if(S.running)tick()},1000);
let lastIdx=nowIdx(),lastDay=todayKey();
setInterval(()=>{const k=todayKey(),i=nowIdx();if(k!==lastDay){if(cursor===lastDay)cursor=k;lastDay=k;lastIdx=i;render()}else if(i!==lastIdx){lastIdx=i;render()}},30000);
document.addEventListener('pointerup',()=>{if(!drag&&pendingRender){pendingRender=false;render()}});

loadLocal();render();connect();
</script>
